name: Build Defold Web

on:
  push:
    branches: [defold/development]
    paths:
      - 'game.project'
      - 'app/**'
      - 'studio/**'
      - 'scenarios/**'
      - 'game/**'
      - 'shared/**'
      - 'assets/**'
      - 'input/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/defold.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defold-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Defold HTML5 without the editor
        run: python3 scripts/defold.py build
      - name: Upload HTML5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bird-defold-html5
          path: dist/defold/*/
          if-no-files-found: error
