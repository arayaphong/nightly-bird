<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>นกแดงราตรี</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap">
<style>
/* Layout: full-screen canvas game; a single fixed UI layer floats score + start/game-over cards. Night-only look by design. */
:root{
  --sky-top:#05071a; --sky-low:#152049;
  --ink:#f4efe1; --ink-dim:#a9b1d6;
  --bird:#e3352b; --danger:#ff5a4a; --card:rgba(10,14,40,.72);
  --display:"Mitr","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sky-top);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;font-family:var(--display);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.score{font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.left{display:flex;flex-direction:column;gap:6px}
.agi{font-size:.8rem;letter-spacing:.06em;color:#9dff2e;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(90,255,80,.4)}
.agi b{font-weight:600}
.agi.up{animation:agiup .6s ease-out}
@keyframes agiup{30%{transform:scale(1.25);color:#eaffe4}}
@media (prefers-reduced-motion:reduce){.agi.up{animation:none}}
.score small{font-size:.9rem;font-weight:400;color:var(--ink-dim);margin-left:4px}
.wind{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(10,14,40,.55);border:1px solid rgba(190,210,255,.18);font-size:.75rem;color:var(--ink-dim);align-self:flex-start}
.wind svg{width:34px;height:34px;flex:none}
.wind .ring{fill:none;stroke:rgba(190,210,255,.25);stroke-width:1.5}
.wind .arrow{fill:none;stroke:#cfe0ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wind #windArrow{transition:transform .6s ease}
.wind.calm .arrow{stroke:rgba(190,210,255,.3)}
.wind .wtxt{display:flex;flex-direction:column;gap:3px;line-height:1}
.wind .bars{display:flex;gap:2px}
.wind .bars i{width:7px;height:4px;border-radius:2px;background:rgba(190,210,255,.18)}
.wind .bars i.on{background:#cfe0ff}
.wind.s4 .bars i.on{background:#ffb08a}
.wind.s4 .arrow{stroke:#ffb08a}
.wind.s5 .bars i.on{background:#ff6f5e}
.wind.s5 .arrow{stroke:#ff6f5e}
.item.worm{background:rgba(255,150,170,.14);border-color:rgba(255,160,180,.5);color:#ffc6d2}
.item.worm i{width:16px;height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,#ff9fb4 0 3px,#e2708a 3px 4px)}
.revive{pointer-events:auto;margin-top:14px;font:inherit;font-size:1rem;font-weight:600;color:#3a0d18;background:linear-gradient(#ffc6d2,#ff8fa8);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 18px rgba(255,120,150,.35)}
.revive:focus-visible{outline:2px solid #fff;outline-offset:3px}
.revive small{display:block;font-weight:400;font-size:.75rem;opacity:.75}
.shop .shop-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.shop-btn{pointer-events:auto;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(244,239,225,.16);border-radius:12px;padding:9px 12px;cursor:pointer}
.shop-btn span{flex:1;min-width:0;font-size:.95rem;line-height:1.25}
.shop-btn small{display:block;color:var(--ink-dim);font-size:.72rem}
.shop-btn em{font-style:normal;font-size:.75rem;color:#ffc6d2;white-space:nowrap}
.shop-btn:disabled{opacity:.45;cursor:default}
.shop-btn:not(:disabled):active{transform:scale(.98)}
.shop-btn:focus-visible{outline:2px solid #ffc6d2;outline-offset:2px}
.ic{flex:none;width:22px;height:14px;border-radius:4px}
.ic.helmet{height:12px;border-radius:12px 12px 3px 3px;background:linear-gradient(#ffe27a,#d99a12)}
.ic.suit{width:16px;height:18px;border-radius:4px 4px 8px 8px;background:linear-gradient(#bfe3ff,#3d8be0)}
.ic.gun{height:7px;border-radius:1px 3px 3px 1px;background:linear-gradient(#c9ccd6,#5b6070);box-shadow:-4px 6px 0 -1px #5b6070}
.item.magnet{background:rgba(255,90,90,.14);border-color:rgba(255,140,140,.5);color:#ffd0d0}
.item.magnet i{width:14px;height:13px;border:4px solid #e8343f;border-top:0;border-radius:0 0 9px 9px;box-sizing:border-box;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.item.boost{background:linear-gradient(90deg,rgba(255,90,90,.18),rgba(255,210,60,.18),rgba(80,230,140,.18),rgba(90,160,255,.18),rgba(190,110,255,.18));border-color:rgba(255,255,255,.35);color:#fff}
.item.boost i{width:14px;height:14px;border-radius:50%;background:conic-gradient(#ff5a5a,#ffd23c,#50e68c,#5aa0ff,#be6eff,#ff5a5a)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item{display:flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px 3px 8px;border-radius:999px;background:rgba(242,194,48,.16);border:1px solid rgba(242,194,48,.5);color:#ffe08a;animation:pop .35s ease-out}
.item i{width:16px;height:10px;border-radius:10px 10px 2px 2px;background:linear-gradient(#ffe27a,#d99a12);box-shadow:inset 0 -2px 0 #a66f05}
.item.suit{background:rgba(110,190,255,.16);border-color:rgba(130,200,255,.55);color:#bfe3ff}
.item.suit i{width:12px;height:14px;border-radius:3px 3px 6px 6px;background:linear-gradient(#bfe3ff,#3d8be0);box-shadow:inset 0 -2px 0 #1f5fa8}
.item.gun{background:rgba(255,120,90,.15);border-color:rgba(255,140,110,.5);color:#ffc2b0}
.item.gun i{width:16px;height:6px;border-radius:1px 3px 3px 1px;background:linear-gradient(#c9ccd6,#5b6070);box-shadow:-3px 4px 0 -1px #5b6070}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.item{animation:none}}
.best{font-size:.85rem;color:var(--ink-dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.card{margin:auto;max-width:320px;text-align:center;background:var(--card);border:1px solid rgba(244,239,225,.12);
  border-radius:18px;padding:22px 24px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h1{margin:0 0 6px;font-size:2rem;font-weight:600;text-wrap:balance}
.card h1 span{color:var(--bird)}
.card p{margin:6px 0;color:var(--ink-dim);line-height:1.55;font-size:.95rem}
.card .go{margin-top:14px;font-size:1.05rem;color:var(--ink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.card .go{animation:none}}
</style>

<canvas id="c"></canvas>
<div class="ui">
  <div class="hud">
    <div class="left"><div class="score" id="score">0<small>ม.</small></div><div class="agi" id="agi">AGI <b>0.25</b></div></div>
    <div class="wind calm" id="wind"><svg viewBox="-20 -20 40 40" aria-hidden="true"><circle r="18" class="ring"></circle><g id="windArrow"><path d="M-11 0H9M3-6l7 6-7 6" class="arrow"></path></g></svg><div class="wtxt"><span id="windLbl">ลมสงบ</span><span class="bars" id="windBars"><i></i><i></i><i></i><i></i><i></i></span></div></div>
    <div class="side"><div class="best" id="best">สถิติ 0 ม.</div><div class="item" id="item" hidden><i></i>หมวกนิรภัย</div><div class="item suit" id="suit" hidden><i></i>ชุดกันฟ้าผ่า</div><div class="item gun" id="gun" hidden><i></i>ปืน</div><div class="item magnet" id="magnet" hidden><i></i><span id="magnetN">แม่เหล็ก</span></div><div class="item boost" id="boost" hidden><i></i><span id="boostN">เร็ว ×4</span></div><div class="item worm" id="worms" hidden><i></i><span id="wormN">หนอน ×0</span></div></div>
  </div>
  <div class="card" id="start">
    <h1>นก<span>แดง</span>ราตรี</h1>
    <p>แตะค้างไว้ให้นกบินขึ้น<br>ปล่อยมือ นกจะร่อนลง</p>
    <div class="go">แตะเพื่อเริ่ม</div>
  </div>
  <div class="card" id="over" hidden>
    <h1 id="overTitle">โดนปลา<span>งับ</span></h1>
    <p id="overText"></p>
    <button class="revive" id="revive" type="button" hidden>ชุบชีวิต ใช้หนอน 1 ตัว<small id="reviveSub"></small></button>
    <div class="go">แตะที่อื่นเพื่อเล่นใหม่</div>
  </div>
  <div class="card shop" id="shop" hidden>
    <h1>แลก<span>หนอน</span></h1>
    <p>หนอน 1 ตัว แลกไอเท็มได้ 1 ชิ้น<br>เหลือหนอน <b id="shopWorms">0</b> ตัว</p>
    <div class="shop-list">
      <button class="shop-btn" type="button" data-item="helmet"><i class="ic helmet"></i><span>หมวกนิรภัย<small>กันเหยี่ยวหรือปลา 1 ครั้ง</small></span><em>1 หนอน</em></button>
      <button class="shop-btn" type="button" data-item="suit"><i class="ic suit"></i><span>ชุดกันฟ้าผ่า<small>กันฟ้าผ่า 1 ครั้ง</small></span><em>1 หนอน</em></button>
      <button class="shop-btn" type="button" data-item="gun"><i class="ic gun"></i><span>ปืน<small>ยิงผู้ล่าให้หายไป 10 วินาที</small></span><em>1 หนอน</em></button>
    </div>
    <button class="revive" id="shopGo" type="button">บินต่อ</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const $score=document.getElementById('score'),$best=document.getElementById('best'),
      $start=document.getElementById('start'),$over=document.getElementById('over'),$overText=document.getElementById('overText');
let W=0,H=0,DPR=1,waterY=0,dangerY=0;
let stars=[],t=0,state='ready',dist=0,speed=0,holding=false,deadAt=0,overShown=false,underT=0,deathBy='';
let best=0; try{best=+localStorage.getItem('rbn-best')||0}catch(e){}
const bird={x:0,y:0,vy:0,r:14,flap:0,alive:true};
let magnetT=0,shake=0,sparks=[],fishCorpse=null,wind={x:0,y:0,tx:0,ty:0,ang:0,lvl:0,next:0},windParts=[],stageShown=0,baseSpeed=0,boostT=0,flies=[],flyT=1.5,bullets=[],labels=[],gifts=[],giftT=6,clouds=[],cloudT=2,flash=0,feathers=[],ripples=[],hawk=null,highY=0,fish=null,splashes=[],bubbles=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  waterY=H*0.8;highY=H*0.3;dangerY=waterY-Math.max(46,H*0.085);
  bird.x=Math.min(W*0.3,180);bird.r=Math.max(12,Math.min(W,H)*0.032);
  stars=[];
  const layers=[{n:90,s:.06,r:[.4,1]},{n:45,s:.16,r:[.8,1.5]},{n:18,s:.34,r:[1.3,2.2]}];
  layers.forEach((L,li)=>{for(let i=0;i<L.n*(W/500+.4);i++)stars.push({
    x:Math.random()*W,y:Math.random()*(waterY-20),r:L.r[0]+Math.random()*(L.r[1]-L.r[0]),
    s:L.s,ph:Math.random()*6.28,tw:1+Math.random()*3,l:li,hue:Math.random()<.15?(Math.random()<.5?'#ffd9a8':'#bcd4ff'):'#fff'})});
  if(state!=='play')bird.y=H*0.42;
}
bird.agi=0.25;addEventListener('resize',resize);resize();newFish();newHawk();
$best.textContent=`สถิติ ${best} ม.`;

function reset(){newFish();magnetT=0;setMagnet();sparks=[];fishCorpse=null;bird.worms=0;setWorms();wind={x:0,y:0,tx:0,ty:0,ang:0,lvl:0,next:WIND_START_M};bird.vx=0;windParts=[];setWindHud();fish.locked=true;stageShown=0;flies=[];flyT=1.5;bird.agi=AGI_START;showAgi(false);gifts=[];giftT=5+Math.random()*4;bird.helmet=false;bird.inv=0;bird.suit=false;bird.zinv=0;bird.gun=TEST_START_WITH_GUN;bullets=[];setItem();clouds=[];cloudT=2+Math.random()*2;flash=0;bird.zapped=false;bird.rot=0;overShown=false;underT=0;newHawk();hawk.locked=!TEST_HAWK_FROM_START;if(!hawk.locked){hawk.x=-hawkSize()*2;hawk.dir=1;hawk.vx=80}bird.x=Math.min(W*0.3,180);dist=0;speed=baseSpeed=W*0.32+120;boostT=0;setBoost();jet=[];suitDone=false;bird.y=H*0.42;bird.vy=0;bird.alive=true;bird.skips=rollSkips();splashes=[];bubbles=[];ripples=[];feathers=[];}
function rollSkips(){return 3} // exactly 3 surface bounces; the 4th touch drowns the bird
function newHawk(){hawk={x:W*0.35,y:H*0.14,vx:60,vy:0,dir:1,mode:'patrol',rest:0,ate:false,ang:0,flap:0}}
function newFish(){fish={x:W*0.75,y:waterY+(H-waterY)*0.5,vx:-1,vy:0,dir:-1,mode:'patrol',ate:false,ang:Math.PI,bob:Math.random()*6}}
function press(e){
  e.preventDefault();if(state==='shop')return;holding=true;
  if(state==='ready'){reset();state='play';$start.hidden=true;}
  else if(state==='dead'&&overShown){
    if(e.target&&e.target.closest&&e.target.closest('#revive')){holding=false;return} // handled by the button's click
    reset();state='play';$over.hidden=true;}
}
function release(){holding=false}
addEventListener('pointerdown',press,{passive:false});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(!e.repeat)press(e)}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release()});

function splash(x,n,pow){for(let i=0;i<n;i++)splashes.push({x,y:waterY,vx:(Math.random()-.5)*pow*1.4,vy:-Math.random()*pow-pow*.3,life:1})}

function update(dt){
  t+=dt;shake=Math.max(0,shake-dt);updateWing(dt);if(bird.chewT>0)bird.chewT=Math.max(0,bird.chewT-dt);
  // blinking: a quick blink every 1.5–4.5 s, sometimes a double blink
  if(bird.blink>0){bird.blink=Math.max(0,bird.blink-dt);if(!bird.blink&&bird.dbl){bird.dbl=false;bird.blinkNext=.12}}
  else if(bird.alive!==false){bird.blinkNext=(bird.blinkNext??2)-dt;if(bird.blinkNext<=0){bird.blink=BLINK_DUR;bird.dbl=Math.random()<.25;bird.blinkNext=1.5+Math.random()*3}}
  const sc=state==='play'?speed:60; // idle drift on menus
  stars.forEach(s=>{s.x-=sc*s.s*dt;if(s.x<-4)s.x+=W+8});
  if(state==='play'){
    if(boostT>0){boostT-=dt;if(boostT<=0)boostT=0;setBoost()}
    if(magnetT>0){const was=Math.ceil(magnetT);magnetT=Math.max(0,magnetT-dt);if(Math.ceil(magnetT)!==was||!magnetT)setMagnet()}
    speed+=(baseSpeed*(boostT>0?BOOST_MULT:1)-speed)*Math.min(1,dt*3); // eases to ×BOOST_MULT while boosted, back to base after
    updateJet(dt);dist+=speed*dt; // base scroll speed is constant; wind provides the rising difficulty
    const wet=bird.y>waterY; // underwater: heavy drag, weak flaps, slow sinking
    const AGILITY=bird.agi; // flight responsiveness in the air (1 = original); starts at AGI_START, fireflies raise it
    const up=wet?H*1.7:H*2.7*AGILITY,g=wet?H*0.45:H*1.5*AGILITY,max=wet?H*0.45:H*0.95;
    if(wet)bird.vy*=1-Math.min(1,dt*3.5);
    bird.vy+=((holding?-up:g)+(wet?0:wind.y))*dt;bird.vy=Math.max(-max,Math.min(max,bird.vy));
    // sideways wind drifts the bird along the screen within a band
    bird.vx+=((wet?0:wind.x)-bird.vx)*Math.min(1,dt*1.2);bird.x+=bird.vx*dt;
    const xl=Math.max(bird.r*3,W*0.1),xr=W*0.62;if(bird.x<xl){bird.x=xl;bird.vx=Math.max(0,bird.vx)}if(bird.x>xr){bird.x=xr;bird.vx=Math.min(0,bird.vx)}
    const before=bird.y;bird.y+=bird.vy*dt;
    // skip off the surface like a stone, each bounce lower: 1st peaks with the red dashed line through the
    // middle of the body, 2nd reaches half that height, 3rd half of the 2nd. The 4th touch: the bird drowns.
    const foot=bird.r*0.55;
    if(!wet&&bird.vy>0&&bird.y+foot>waterY&&before+foot<=waterY){
      if(bird.skips>0){
        const n=3-bird.skips,h1=(waterY-foot)-dangerY,hgt=h1*Math.pow(.5,n),gFall=H*1.5*AGILITY;
        bird.y=waterY-foot;bird.vy=-Math.sqrt(2*gFall*hgt);bird.skips--;   // launch speed that peaks exactly at hgt
        splash(bird.x,10,H*0.24);for(let i=0;i<4;i++)ripples.push({x:bird.x,r:4,life:1});
      }else{splash(bird.x,16,H*.3);for(let i=0;i<4;i++)ripples.push({x:bird.x,r:4,life:1});catchBird('drown')}
    }
    if(bird.y+bird.r<dangerY-H*0.06&&bird.skips<3)bird.skips=rollSkips(); // flew clear: bounces refill
    if((fish.gone>0||fish.locked)&&bird.y-bird.r>waterY)catchBird('drown'); // no fish around: going under means drowning
    if((before<=waterY)!==(bird.y<=waterY))splash(bird.x,wet?8:12,H*(wet?.22:.3)); // entering or leaving the water
    if(bird.y>H-bird.r-4){bird.y=H-bird.r-4;bird.vy=Math.min(0,bird.vy)}
    if(wet&&Math.random()<dt*14)bubbles.push({x:bird.x+(Math.random()-.5)*bird.r,y:bird.y-bird.r*.5,life:1});
    if(bird.y<bird.r+8){bird.y=bird.r+8;bird.vy=Math.max(0,bird.vy)}
    bird.flap+=dt*(holding?26:9);
    const m=Math.round(dist/40);$score.firstChild.nodeValue=m;
  } else if(state==='dead'){updateJet(dt); // every death ends with the bird sinking; the card waits until it is under
    if(deathBy!=='fish'){
      const wet=bird.y>waterY,before=bird.y;
      if(wet){bird.vy+=(H*0.09-bird.vy)*Math.min(1,dt*4);bird.x+=Math.sin(t*2.2)*12*dt} // limp, slow sink with a gentle drift
      else bird.vy+=H*1.5*dt;                              // tumble down
      bird.y+=bird.vy*dt; // no sea floor: the body keeps sinking out of viewbird.rot+=dt*(wet?1.2:7);
      if(before<=waterY&&bird.y>waterY){splash(bird.x,14,H*.28);for(let i=0;i<4;i++)ripples.push({x:bird.x,r:4,life:1});bird.vy*=0.3}
      if(wet&&Math.random()<dt*10)bubbles.push({x:bird.x+(Math.random()-.5)*bird.r,y:bird.y-bird.r*.5,life:1});
    }
    const under=deathBy==='fish'?fish.y>waterY+fishSize()*.5:bird.y-bird.r>waterY;
    if(under)underT+=dt;
    // card only after the body has sunk past the bottom edge (fish: after it drags the bird out of view)
    const gone=deathBy==='fish'?fish.y-fishSize()>H:bird.y-bird.r*2>H;
    if(!overShown&&((gone&&underT>0.3)||t-deadAt>9))showOver();
  } else if(state==='ready'){bird.y=H*0.42+Math.sin(t*2)*10;bird.flap+=dt*10}
  updateStages();updateWind(dt);updateFish(dt);updateHawk(dt);updateFlies(dt);updateClouds(dt);updateGifts(dt);updateBullets(dt);updateSparks(dt);updateCorpse(dt);
  feathers.forEach(f=>{f.vy+=60*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=1-dt*1.5;f.rot+=dt*4;f.life-=dt*.6});feathers=feathers.filter(f=>f.life>0);
  splashes.forEach(p=>{p.vy+=H*1.6*dt;p.x+=p.vx*dt-(state==='play'?speed:0)*dt;p.y+=p.vy*dt;p.life-=dt*1.4});
  ripples.forEach(r=>{r.r+=60*dt;r.life-=dt*1.6;r.x-=(state==='play'?speed:0)*dt});ripples=ripples.filter(r=>r.life>0);
  splashes=splashes.filter(p=>p.life>0&&p.y<waterY+10);

  for(let i=0;i<10;i++)feathers.push({x:bird.x+bird.r,y:bird.y-bird.r*.5,vx:(Math.random()-.5)*240,vy:(Math.random()-.8)*200,life:1,rot:Math.random()*6,c:i%2?'#f2c230':'#fff3b0'});
  flash=.4;
  if(by==='hawk'){const h=hawk;h.vx=-h.vx*0.7;h.vy=-Math.abs(h.vy)*0.8-H*0.3;h.mode='patrol';h.stun=1.0}
  else{const f=fish,away=Math.sign(f.x-bird.x)||1;
    if(f.mode==='leap'){f.vy=Math.abs(f.vy)*0.4+H*0.3;f.vx=away*Math.abs(f.vx||200)*0.6}
    else{f.vx=away*Math.max(380,W*1.05)*0.6;f.vy=H*0.4;f.mode='recover';f.rest=1.0}}
}
/* Gun: fires by itself the moment the hawk starts a dive or the fish starts a charge.
   The round homes in on the attacker; a hit removes it from the scene for 10 s. One shot, then the gun is gone. */
const GONE_TIME=10;
function fireGun(who){
  bird.gun=false;setItem();
  const tg=who==='hawk'?hawk:fish,a=Math.atan2(tg.y-bird.y,tg.x-bird.x),v=Math.max(900,H*1.6);
  bullets.push({x:bird.x+bird.r,y:bird.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,who,life:1.5,trail:[]});
  for(let i=0;i<6;i++)feathers.push({x:bird.x+bird.r*1.2,y:bird.y,vx:Math.cos(a)*120+(Math.random()-.5)*80,vy:Math.sin(a)*120+(Math.random()-.5)*80,life:.5,rot:0,c:'#ffd27a'});
}
function updateBullets(dt){
  for(const b of bullets){
    const tg=b.who==='hawk'?hawk:fish,sz=b.who==='hawk'?hawkSize():fishSize();
    if(!(tg.gone>0)){const sp=Math.hypot(b.vx,b.vy),a=Math.atan2(tg.y-b.y,tg.x-b.x);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp}
    b.trail.push([b.x,b.y]);if(b.trail.length>6)b.trail.shift();
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(!(tg.gone>0)&&Math.hypot(tg.x-b.x,tg.y-b.y)<sz*.6){
      b.life=0;tg.ate=false;flash=Math.max(flash,.3);
      if(b.who==='fish'){ // sparks on impact, then the fish rolls belly-up and sinks to the bottom
        burstSparks(b.x,b.y,Math.atan2(b.vy,b.vx));
        fishCorpse={x:tg.x,y:tg.y,vx:(tg.vx||0)*.2+b.vx*.04,vy:tg.y>waterY?-H*.04:Math.min(tg.vy||0,0)*.35, // knocked up a little by the hit
          dir:Math.cos(tg.ang)>=0?1:-1,tilt:0,roll:1,sw:tg.sw||0,wet:tg.y>waterY,twitch:.9};
      }else{
        const cols=['#5a4a72','#3a2f4f','#ffd27a'];
        for(let i=0;i<16;i++)feathers.push({x:tg.x,y:tg.y,vx:(Math.random()-.5)*240,vy:(Math.random()-.6)*220,life:1,rot:Math.random()*6,c:cols[i%3]});
      }
      tg.gone=GONE_TIME;
      labels.push({x:tg.x,y:Math.min(tg.y,waterY-20)-20,txt:(b.who==='hawk'?'เหยี่ยว':'ปลา')+' หายไป 10 วิ',col:'#ffc2b0',life:1.2});
    }
  }

function respawn(who){ // comes back in from off-screen, never pops into view

  else{newFish();fish.x=W+fishSize()*2;fish.dir=-1;fish.vx=-80}

function drawBullets(){

const FISH_PART={2:'tail',5:'tail',8:'fin',11:'gill'};
const FISH_PIVOT={tail:[1236,566],fin:[762,560],gill:[640,536]};
const FISH_TAIL_CUT=1232; // x where the silhouette is split between body and tail
const fishVec=[];
FISH_SVG.forEach(([fill,tx,ty,d],i)=>{const path=new Path2D(d);
  if(i===0){fishVec.push({fill,tx,ty,path,part:'body',clip:[0,FISH_TAIL_CUT+8]},{fill,tx,ty,path,part:'tail',clip:[FISH_TAIL_CUT-14,1536]});return}
  fishVec.push({fill,tx,ty,path,part:FISH_PART[i]||'body'})});

const darken=(hex,a)=>{const n=parseInt(hex.slice(1),16),m=(c,d)=>Math.round(c+(d-c)*a);return `rgb(${m(n>>16,18)},${m(n>>8&255,13)},${m(n&255,10)})`}; // scorched tint (shot fish)

  const c=Math.cos(fish.ang),n=Math.sin(fish.ang);return{x:fish.x+lx*c-ly*n,y:fish.y+lx*n+ly*c}}
function drawFishBody(x,y,ang,belly,alpha,pose,burnt){ // burnt: scorched colours for a shot fish // belly: 1 = upright, -1 = upside down (values between = mid-roll)
  const s=fishSize();cx.save();cx.translate(x,y);cx.rotate(ang);
  if(Math.cos(ang)<0)cx.scale(1,-1);   // keep the belly down when swimming left
  cx.scale(1,belly);cx.globalAlpha=alpha;

function updateCorpse(dt){

function hkFeather(g,x,y,ang,len,w,fill){ // rounded flat feather, base at (x,y) pointing along ang

  g.bezierCurveTo(len*.3,-w*.62,len*.82,-w*.5,len,-w*.08);g.quadraticCurveTo(len*1.02,w*.12,len*.9,w*.24);
  g.bezierCurveTo(len*.65,w*.5,len*.25,w*.42,0,w*.18);g.closePath();g.fill();g.restore()}
const HD=a=>a*Math.PI/180;
// wing fans: [angleDeg, length, width] from the shoulder pivot
const HK_PRIM=[[-142,700,118],[-153,720,120],[-164,650,118],[-175,560,112],[-186,470,104],[-196,380,96]];
const HK_SEC =[[-140,470,112],[-152,480,112],[-164,440,108],[-176,380,100],[-188,320,92]];
const HK_COV =[[-136,300,104],[-150,300,104],[-164,280,98],[-178,240,90]];
const HK_TAIL=[[166,430,104],[172,500,108],[178,520,110],[184,500,108],[191,440,100]];
function hkWing(g,px,py,rot,spread,lenK,back){ // spread: 1 open, <1 folded
  const C=HK.col;
  const layer=(fan,fill,lk,inset)=>fan.forEach(([a,l,w])=>{const aa=HD(-170+(a+170)*spread)+rot;hkFeather(g,px+Math.cos(aa)*inset,py+Math.sin(aa)*inset,aa,l*lk*lenK,w,fill)});
  if(back){layer(HK_PRIM,C.navy,.92,0);layer(HK_SEC,C.navy2,.9,0);return}
  layer(HK_PRIM,C.navy,1,0);layer(HK_SEC,C.slate,1,10);layer(HK_COV,C.slate2,1,20);
  // pale edge highlights on the coverts
  HK_COV.slice(0,3).forEach(([a,l,w])=>{const aa=HD(-170+(a+170)*spread)+rot;hkFeather(g,px+Math.cos(aa)*60,py+Math.sin(aa)*60,aa,l*.55*lenK,w*.55,C.pale)});
}
function hkTalons(g,x,y,ext){ // ext 0 tucked under the belly .. 1 thrust forward with claws spread (stoop)
  const C=HK.col,sc=1+.45*ext;g.save();g.translate(x,y);g.rotate(HD(-10-84*ext));g.scale(sc,sc);
  for(const [ox,oy] of [[0,0],[52,26]]){g.save();g.translate(ox,oy);
    g.fillStyle=C.foot;g.beginPath();g.roundRect(-15,-40,30,58+70*ext,13);g.fill();        // leg
    const fy=18+70*ext,spr=1+.6*ext;g.lineCap='round';
    for(const a of [90-38*spr,90,90+38*spr]){const tl=44+22*ext,tx=Math.cos(HD(a))*tl,ty=fy+Math.sin(HD(a))*tl*.8;
      g.strokeStyle=C.foot;g.lineWidth=18;g.beginPath();g.moveTo(0,fy);g.lineTo(tx,ty);g.stroke();          // toe
      const cl=16+14*ext,ca=HD(a);g.strokeStyle=C.claw;g.lineWidth=9+3*ext;g.beginPath();g.moveTo(tx,ty);       // hooked claw, curling inward
      g.quadraticCurveTo(tx+Math.cos(ca)*cl,ty+Math.sin(ca)*cl,tx+Math.cos(ca+HD(100))*cl*1.1,ty+Math.sin(ca+HD(100))*cl*1.1);g.stroke()}
    g.restore()}
  g.restore()}

/* pose: {flap:-1..1 (−1 wings high, +1 wings low), dive:0..1, glow:0..1, dark:bool} */
function drawHawkArt(g,pose){
  const C=HK.col,[ox,oy]=HK.O;g.save();g.translate(-ox,-oy);
  const dv=pose.dive||0,fl=pose.flap*(1-dv);
  const rot=HD(fl*-48)+HD(dv*20),spread=1-.5*dv,lenK=1+.06*dv; // stoop: wings raised and swept back, fan closed
  // back wing (far side), a little higher and darker
  hkWing(g,900,585,rot+HD(-14+dv*10),spread,lenK,true);
  // tail fan
  HK_TAIL.forEach(([a,l,w],i)=>hkFeather(g,575,800,HD(178+(a-178)*(1-.55*dv)-6*dv),l*(1+.08*dv),w*(1-.15*dv),i%2?C.slate:C.navy));
  HK_TAIL.slice(1,4).forEach(([a,l,w])=>hkFeather(g,600,805,HD(178+(a-178)*(1-.55*dv)-6*dv),l*.55,w*.6,C.pale));
  // body
  g.fillStyle=C.slate;g.beginPath();g.moveTo(545,770);g.bezierCurveTo(640,650,840,560,1000,560);
  g.bezierCurveTo(1085,600,1135,700,1122,785);g.bezierCurveTo(1095,905,955,955,800,948);
  g.bezierCurveTo(675,942,590,885,545,770);g.fill();
  g.fillStyle=C.navy2;g.beginPath();g.moveTo(560,760);g.bezierCurveTo(660,660,840,590,990,585);g.bezierCurveTo(900,640,760,720,620,800);g.closePath();g.fill();
  // belly
  g.fillStyle=C.belly2;g.beginPath();g.moveTo(620,860);g.bezierCurveTo(740,780,940,735,1124,712);
  g.bezierCurveTo(1130,820,1070,915,935,940);g.bezierCurveTo(810,960,690,925,620,860);g.fill();
  g.fillStyle=C.belly;g.beginPath();g.moveTo(690,850);g.bezierCurveTo(800,790,960,750,1118,735);
  g.bezierCurveTo(1110,830,1050,890,930,905);g.bezierCurveTo(830,915,740,895,690,850);g.fill();
  // talons (tucked under the belly, reach forward on a dive)
  if(dv>.05){g.globalAlpha=Math.min(1,dv*1.5);g.fillStyle=C.belly2;g.beginPath();g.ellipse(930+dv*40,870,95*dv+20,62,HD(-35),0,7);g.fill(); // feathered thighs
    g.fillStyle=C.belly;g.beginPath();g.ellipse(950+dv*40,858,70*dv+14,44,HD(-35),0,7);g.fill();g.globalAlpha=1}
  hkTalons(g,560+dv*430,895+dv*10,dv);
  // front wing
  hkWing(g,875,615,rot,spread,lenK,false);
  // head
  g.fillStyle=C.head;g.beginPath();g.moveTo(955,575);g.bezierCurveTo(990,505,1100,495,1165,555);
  g.bezierCurveTo(1205,600,1205,672,1160,715);g.bezierCurveTo(1110,760,1035,748,985,712);g.closePath();g.fill();
  // crest feathers swept back
  hkFeather(g,1010,540,HD(-160),120,46,C.navy2);hkFeather(g,1000,560,HD(-172),130,44,C.navy);hkFeather(g,1030,525,HD(-150),95,40,C.slate);
  // cheek / throat
  g.fillStyle=C.belly;g.beginPath();g.moveTo(985,712);g.bezierCurveTo(1040,690,1110,690,1158,712);
  g.bezierCurveTo(1150,760,1080,800,1000,770);g.closePath();g.fill();
  // eye mask + eye with an angry lid
  g.fillStyle=C.mask;g.beginPath();g.moveTo(1000,640);g.bezierCurveTo(1050,612,1125,615,1150,648);
  g.bezierCurveTo(1135,692,1070,705,1030,690);g.bezierCurveTo(1015,675,1004,660,1000,640);g.fill();
  if(pose.glow){g.shadowColor='#ffb03a';g.shadowBlur=(8+30*pose.glow)*(pose.px||1)}
  g.fillStyle=pose.glow?`rgb(255,${(192-60*pose.glow)|0},${(74-30*pose.glow)|0})`:C.eye;g.beginPath();g.ellipse(1098,668,36,31,HD(8),0,7);g.fill();g.shadowBlur=0;
  g.fillStyle=C.pupil;g.beginPath();g.arc(1108,673,13,0,7);g.fill();
  g.fillStyle=C.mask;g.beginPath();g.moveTo(1052,628);g.lineTo(1150,646);g.lineTo(1146,662);g.lineTo(1056,650);g.closePath();g.fill(); // scowl
  // hooked beak
  g.fillStyle=C.beak;g.beginPath();g.moveTo(1128,650);g.bezierCurveTo(1185,632,1232,668,1236,722);
  g.bezierCurveTo(1238,748,1226,768,1214,778);g.bezierCurveTo(1212,750,1196,730,1170,724);
  g.bezierCurveTo(1148,720,1130,722,1118,708);g.closePath();g.fill();
  g.fillStyle=C.beak2;g.beginPath();g.moveTo(1214,778);g.bezierCurveTo(1212,750,1196,730,1170,724);g.lineTo(1184,742);g.bezierCurveTo(1202,752,1210,762,1214,778);g.fill();
  g.fillStyle=C.beak2;g.beginPath();g.moveTo(1118,708);g.bezierCurveTo(1140,716,1160,716,1172,724);g.lineTo(1150,734);g.bezierCurveTo(1135,730,1124,722,1118,708);g.fill();
  g.restore();
}
/* Stoop pose (attack dive) — wings folded flat into one long teardrop, after the designer's reference.
   Same scale as drawHawkArt; origin at (700,650), facing right, head leading. */
function hkBlade(g,bx,by,tx,ty,w,fill){ // pointed feather blade from a rounded base (bx,by) to a sharp tip (tx,ty)
  const a=Math.atan2(ty-by,tx-bx),l=Math.hypot(tx-bx,ty-by);g.save();g.translate(bx,by);g.rotate(a);g.fillStyle=fill;g.beginPath();
  g.moveTo(0,-w*.5);g.bezierCurveTo(l*.35,-w*.55,l*.75,-w*.3,l,0);g.bezierCurveTo(l*.75,w*.22,l*.35,w*.45,0,w*.5);g.quadraticCurveTo(-w*.35,0,0,-w*.5);g.fill();g.restore()}
function drawHawkStoop(g,pose){
  const C=HK.col,fl=Math.sin((pose.t||0)*45)*5; // wingtips buzz in the airstream
  g.save();g.translate(-700,-650);
  // silhouette
  g.fillStyle=C.navy2;g.beginPath();g.moveTo(40,505);g.bezierCurveTo(300,478,700,500,1000,540);g.bezierCurveTo(1120,560,1182,622,1182,700);
  g.bezierCurveTo(1172,762,1100,802,1000,812);g.bezierCurveTo(800,832,600,792,450,742);g.bezierCurveTo(300,690,150,630,40,505);g.fill();
  // belly
  g.fillStyle=C.belly2;g.beginPath();g.moveTo(430,708);g.bezierCurveTo(600,780,820,826,1010,808);g.bezierCurveTo(1080,800,1120,775,1140,742);
  g.lineTo(990,712);g.bezierCurveTo(820,738,620,735,430,708);g.fill();
  g.fillStyle=C.belly;g.beginPath();g.moveTo(560,722);g.bezierCurveTo(700,770,860,790,1000,778);g.bezierCurveTo(1060,770,1100,752,1120,738);
  g.lineTo(990,712);g.bezierCurveTo(850,730,700,734,560,722);g.fill();
  // folded wing: layered blades swept back to sharp tips
  const B=(bx,by,tx,ty,w,c)=>hkBlade(g,bx,by,tx,ty+fl*(1-tx/1000),w,c);
  B(700,600,35,552,72,C.navy);B(700,560,30,505,74,C.navy2);B(760,640,150,628,62,C.navy);
  B(820,545,132,490,72,C.slate);B(720,600,118,560,52,C.pale);B(780,642,205,622,48,'#b9bccb');
  B(910,530,345,470,74,C.navy2);B(960,560,470,520,82,C.slate);B(890,612,470,562,50,C.pale);B(910,652,545,612,44,'#c4c6d0');
  B(990,600,560,556,90,C.slate2);B(1010,640,620,646,70,C.navy);B(1000,585,690,535,60,'#6f7aa0');
  // head
  g.fillStyle=C.head;g.beginPath();g.moveTo(950,560);g.bezierCurveTo(1030,528,1140,560,1186,640);g.bezierCurveTo(1202,690,1182,732,1150,746);
  g.bezierCurveTo(1080,762,1000,742,960,702);g.closePath();g.fill();
  hkBlade(g,960,566,815,512,40,C.navy);hkBlade(g,990,560,875,520,32,C.navy2);
  g.fillStyle=C.belly;g.beginPath();g.moveTo(962,692);g.bezierCurveTo(1022,680,1100,690,1162,722);g.bezierCurveTo(1122,772,1040,782,962,760);g.fill();
  g.fillStyle=C.mask;g.beginPath();g.moveTo(1018,652);g.bezierCurveTo(1060,630,1122,640,1152,672);g.bezierCurveTo(1132,706,1070,714,1030,692);g.fill();
  if(pose.glow){g.shadowColor='#ff7a2a';g.shadowBlur=(10+34*pose.glow)*(pose.px||1)}
  g.fillStyle=pose.glow?`rgb(255,${(170-80*pose.glow)|0},${(60-30*pose.glow)|0})`:C.eye;g.beginPath();g.ellipse(1100,680,30,23,HD(8),0,7);g.fill();g.shadowBlur=0;
  g.fillStyle=C.pupil;g.beginPath();g.arc(1110,686,10,0,7);g.fill();
  g.fillStyle=C.mask;g.beginPath();g.moveTo(1048,650);g.lineTo(1152,664);g.lineTo(1148,678);g.lineTo(1052,665);g.closePath();g.fill(); // scowl
  // beak
  g.fillStyle=C.beak;g.beginPath();g.moveTo(1140,672);g.bezierCurveTo(1190,664,1232,700,1236,746);g.bezierCurveTo(1238,772,1226,792,1214,800);
  g.bezierCurveTo(1212,772,1198,750,1172,744);g.bezierCurveTo(1150,740,1134,736,1124,720);g.closePath();g.fill();
  g.fillStyle=C.beak2;g.beginPath();g.moveTo(1214,800);g.bezierCurveTo(1212,772,1198,750,1172,744);g.lineTo(1186,762);g.bezierCurveTo(1202,772,1210,784,1214,800);g.fill();
  g.restore();
}
function drawHawk(){
  if(hawk.gone>0||hawk.locked)return;
  const h=hawk,s=hawkSize(),dive=h.mode==='dive',k=dive?1:Math.max(0,Math.min(1,(highY+H*.12-bird.y)/(H*.12)));
  h.dv=(h.dv||0)+(((dive||h.ate)?1:0)-(h.dv||0))*.25;
  const sc=s*2.4/1200,stoop=dive&&!h.ate;
  if(stoop&&h.trail)h.trail.forEach((p,i)=>{ // afterimages + speed streaks behind the dive
    cx.save();cx.translate(p[0],p[1]);if(h.dir<0)cx.scale(-1,1);cx.rotate(p[2]);cx.globalAlpha=.07+.05*i;cx.scale(sc,sc);drawHawkStoop(cx,{t});cx.restore()});
  if(stoop){cx.save();cx.translate(h.x,h.y);if(h.dir<0)cx.scale(-1,1);cx.rotate(h.ang);cx.strokeStyle='rgba(220,230,255,.35)';cx.lineWidth=1.5;cx.lineCap='round';
    for(let i=0;i<5;i++){const y=(i-2)*s*.22,l=s*(1.6+Math.sin(t*30+i*1.7)*.4);cx.beginPath();cx.moveTo(-s*1.3,y);cx.lineTo(-s*1.3-l,y);cx.stroke()}cx.restore()}
  cx.save();cx.translate(h.x,h.y);if(h.dir<0)cx.scale(-1,1);cx.rotate(h.ang);cx.scale(sc,sc);
  if(stoop)drawHawkStoop(cx,{t,glow:1,px:.45});
  else drawHawkArt(cx,{flap:Math.sin(h.flap),dive:0,glow:k,px:.45}); // only two poses: stoop (attack) or normal flight
  cx.restore();
}
function drawFeathers(){
  for(const f of feathers){cx.save();cx.globalAlpha=f.life;cx.translate(f.x,f.y);cx.rotate(f.rot);cx.fillStyle=f.c||'#ff6a55';cx.beginPath();cx.ellipse(0,0,5,1.8,0,0,7);cx.fill();
    if(f.smoke){cx.globalAlpha=f.life*.35;cx.fillStyle='#8a8580';cx.beginPath();cx.arc(-4,-3,3+(1-f.life)*5,0,7);cx.fill()} // a wisp of smoke trailing scorched feathers
    cx.restore()}
}
function drawClouds(){
  for(const c of clouds){
    cx.strokeStyle='rgba(150,175,220,.35)';cx.lineWidth=1;cx.beginPath();
    for(const d of c.drops){cx.moveTo(d.x,d.y);cx.lineTo(d.x-3,d.y+9)}cx.stroke();
    const ch=c.charge>0?c.charge/ZAP_CHARGE:0,flick=ch>0&&Math.sin(t*60)>0?ch:0;
    // danger halo when the bird is close
    if(state==='play'&&bird.alive){const dd=cloudDist(c,bird.x,bird.y)-bird.r,R=cloudReach(c);
      if(dd<R*1.8){cx.globalAlpha=Math.min(1,(R*1.8-dd)/R)*.35;cx.setLineDash([4,6]);cx.strokeStyle='#ffe27a';cx.lineWidth=1.2;
        cx.beginPath();cx.ellipse(c.x,c.y,c.w/2+R,c.h/2+R,0,0,7);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}}
    for(const p of c.puffs){
      const g=cx.createRadialGradient(c.x+p.dx,c.y+p.dy-p.r*.3,p.r*.1,c.x+p.dx,c.y+p.dy,p.r);
      g.addColorStop(0,flick?'#d9dcff':'#5b6181');g.addColorStop(1,flick?'#7d82b8':'#2b2f47');
      cx.fillStyle=g;cx.beginPath();cx.arc(c.x+p.dx,c.y+p.dy+Math.sin(t*1.5+c.ph+p.dx)*1.5,p.r,0,7);cx.fill();
    }
    if(ch>0){cx.globalAlpha=.25+.4*ch;cx.strokeStyle='#fff6b0';cx.lineWidth=1;cx.beginPath();cx.moveTo(c.x+c.w*.1,c.y);cx.lineTo(c.tx,c.ty);cx.setLineDash([2,10]);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}
    if(c.bolt){const a=c.boltT/0.28;
      for(const [w,col] of [[7,'rgba(180,200,255,'+(.35*a)+')'],[2.5,'rgba(255,255,230,'+a+')']]){cx.strokeStyle=col;cx.lineWidth=w;cx.lineJoin='round';cx.beginPath();c.bolt.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke()}}
  }
  if(flash>0){cx.fillStyle=`rgba(220,225,255,${flash*.18})`;cx.fillRect(0,0,W,H)}
}
function drawWaterVeil(){ // tint whatever is under the surface (the bird when it sinks)
  if(bird.y+bird.r<waterY)return;cx.fillStyle='rgba(18,58,92,.3)';cx.fillRect(0,waterY+2,W,H-waterY)}
function drawRipples(){cx.lineWidth=1.5;for(const r of ripples){cx.globalAlpha=Math.max(0,r.life)*.6;cx.strokeStyle='#cfe8ff';cx.beginPath();cx.ellipse(r.x,waterY+2,r.r*1.6,r.r*.3,0,0,7);cx.stroke()}cx.globalAlpha=1}
function drawBubbles(){cx.strokeStyle='#bfe3ff';cx.lineWidth=1;for(const b of bubbles){cx.globalAlpha=b.life*.7;cx.beginPath();cx.arc(b.x,b.y,1.5+(1-b.life)*2,0,7);cx.stroke()}cx.globalAlpha=1}
function drawSplash(){cx.fillStyle='#cfe8ff';for(const p of splashes){cx.globalAlpha=Math.max(0,p.life);cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill()}cx.globalAlpha=1}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state!=='shop')update(dt); // shop pauses the game
  const shk=shake>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches?shake*16:0; // brief jolt when the hawk strikes
  cx.save();if(shk)cx.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);
  drawSky();drawSkyDanger();drawDanger();drawWater();drawRipples();drawWind();drawClouds();drawGifts();drawFlies();drawMagnetField();drawBoostTrail();drawBird();drawWaterVeil();drawFish();drawHawk();drawSparks();drawBullets();drawFeathers();drawLabels();drawReturnCountdown();drawBubbles();drawSplash();
  cx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
