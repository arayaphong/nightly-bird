<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>นกแดงราตรี</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="./styles/game.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="ui">
      <div class="hud">
        <div class="left">
          <div class="score" id="score">0<small>ม.</small></div>
          <div class="agi" id="agi">AGI <b>0.25</b></div>
        </div>
        <div class="wind calm" id="wind">
          <svg viewBox="-20 -20 40 40" aria-hidden="true">
            <circle r="18" class="ring"></circle>
            <g id="windArrow"><path d="M-11 0H9M3-6l7 6-7 6" class="arrow"></path></g>
          </svg>
          <div class="wtxt">
            <span id="windLbl">ลมสงบ</span
            ><span class="bars" id="windBars"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
        </div>
        <div class="side">
          <div class="best" id="best">สถิติ 0 ม.</div>
          <div class="item" id="item" hidden><i></i>หมวกนิรภัย</div>
          <div class="item suit" id="suit" hidden><i></i>ชุดกันฟ้าผ่า</div>
          <div class="item gun" id="gun" hidden><i></i>ปืน</div>
          <div class="item magnet" id="magnet" hidden>
            <i></i><span id="magnetN">แม่เหล็ก</span>
          </div>
          <div class="item boost" id="boost" hidden>
            <i></i><span id="boostN">เร็ว ×4</span>
          </div>
          <div class="item worm" id="worms" hidden><i></i><span id="wormN">หนอน ×0</span></div>
        </div>
      </div>
      <div class="card" id="start">
        <h1>นก<span>แดง</span>ราตรี</h1>
        <p>แตะค้างไว้ให้นกบินขึ้น<br />ปล่อยมือ นกจะร่อนลง</p>
        <div class="go">แตะเพื่อเริ่ม</div>
        <p class="build-version" id="buildVersion">เวอร์ชันพัฒนา</p>
      </div>
      <div class="card" id="over" hidden>
        <h1 id="overTitle">โดนปลา<span>งับ</span></h1>
        <p id="overText"></p>
        <button class="revive" id="revive" type="button" hidden>
          ชุบชีวิต ใช้หนอน 1 ตัว<small id="reviveSub"></small>
        </button>
        <div class="go">แตะที่อื่นเพื่อเล่นใหม่</div>
      </div>
      <div class="card shop" id="shop" hidden>
        <h1>แลก<span>หนอน</span></h1>
        <p>หนอน 1 ตัว แลกไอเท็มได้ 1 ชิ้น<br />เหลือหนอน <b id="shopWorms">0</b> ตัว</p>
        <div class="shop-list">
          <button class="shop-btn" type="button" data-item="helmet">
            <i class="ic helmet"></i
            ><span>หมวกนิรภัย<small>กันเหยี่ยวหรือปลา 1 ครั้ง</small></span
            ><em>1 หนอน</em>
          </button>
          <button class="shop-btn" type="button" data-item="suit">
            <i class="ic suit"></i><span>ชุดกันฟ้าผ่า<small>กันฟ้าผ่า 1 ครั้ง</small></span
            ><em>1 หนอน</em>
          </button>
          <button class="shop-btn" type="button" data-item="gun">
            <i class="ic gun"></i><span>ปืน<small>ยิงผู้ล่าให้หายไป 10 วินาที</small></span
            ><em>1 หนอน</em>
          </button>
        </div>
        <button class="revive" id="shopGo" type="button">บินต่อ</button>
      </div>
      <div class="card" id="paused" hidden>
        <h1>พัก<span>เกม</span></h1>
        <button class="revive" id="pauseGo" type="button">เล่นต่อ</button>
      </div>
    </div>
  </body>
</html>
